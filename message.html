    <!-- ==========================================================================
         🧠 DATA STREAM UTILITIES (FULLY REPAIRED & CLOSED)
         ========================================================================== -->
    <script>
        function fetchDatabaseMessages() {
            const container = document.getElementById('messagesContainer');
            if (!container) return;

            container.innerHTML = '<p class="status-empty">Connecting to MongoDB cloud pipeline clusters...</p>';

            fetch('/api/messages')
                .then(res => res.json())
                .then(messages => {
                    container.innerHTML = '';
                    
                    const counterBadge = document.getElementById('counterBadge');
                    if (counterBadge) {
                        counterBadge.textContent = `Active Signals: ${messages ? messages.length : 0}`;
                    }
                    
                    if (!messages || messages.length === 0) {
                        container.innerHTML = '<div class="card-glass status-empty">💾 Database is completely clear. No active packet transmissions found.</div>';
                        return;
                    }

                    // Loop through and build each message card card container row cleanly
                    messages.reverse().forEach(msg => {
                        const card = document.createElement('div');
                        card.className = 'card-glass message-card';
                        const timestamp = msg.createdAt ? new Date(msg.createdAt).toLocaleString() : new Date().toLocaleString();

                        card.innerHTML = `
                            <div class="message-content">
                                <div class="message-meta">
                                    <span>From: <span class="sender-name">${msg.name || 'Anonymous'}</span> (${msg.email || 'N/A'})</span>
                                    <span>Received: ${timestamp}</span>
                                </div>
                                <div class="message-body">"${msg.message || ''}"</div>
                            </div>
                            <button class="btn btn-danger" onclick="eraseSignalEntry('${msg._id}', this)">
                                Erase Signal
                            </button>
                        `;
                        container.appendChild(card); // ✅ FIXED: Appends the element securely to the DOM canvas
                    });
                })
                .catch(err => {
                    console.error("Fetch failure error info:", err);
                    container.innerHTML = '<div class="card-glass status-empty" style="color:#f87171;">❌ Core Pipeline Link Failure. Unable to synchronize dataset arrays.</div>';
                });
        }

        function eraseSignalEntry(messageId, buttonElement) {
            if (!confirm("Are you absolutely certain you want to permanently delete this message record?")) {
                return;
            }

            fetch(`/api/messages/${messageId}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(result => {
                if (result.success) {
                    const targetedCard = buttonElement.closest('.message-card');
                    if (targetedCard) {
                        targetedCard.style.opacity = '0';
                        targetedCard.style.transform = 'translateY(15px)';
                        setTimeout(() => {
                            targetedCard.remove();
                            fetchDatabaseMessages();
                        }, 300);
                    }
                } else {
                    alert(`Operational Error: ${result.message}`);
                }
            })
            .catch(err => {
                console.error("Deletion crash details:", err);
                alert("Unable to transmit destruction data.");
            });
        }

        // Auto-run trigger parameters immediately on load sequences
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", fetchDatabaseMessages);
        } else {
            fetchDatabaseMessages();
        }
    </script>
</body>
</html>
