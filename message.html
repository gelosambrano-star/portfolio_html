<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Message Console</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0a0f1d;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --card-surface: rgba(17, 24, 39, 0.45);
            --border-glass: rgba(255, 255, 255, 0.06);
            --brand-accent: #3b82f6;
            --danger-accent: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.15);
            --shadow-blur: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            line-height: 1.6;
            padding: 3rem 8%;
        }

        .card-glass {
            background: var(--card-surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            box-shadow: var(--shadow-blur);
        }

        .console-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .console-header h1 { font-size: 2.25rem; font-weight: 800; letter-spacing: -1px; }
        .header-actions { display: flex; gap: 1rem; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); border: 1px solid var(--border-glass); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--text-secondary); }
        .btn-danger { background: var(--danger-glow); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: var(--danger-accent);
            transform: translateY(-1px);
        }

        .messages-stack { display: flex; flex-direction: column; gap: 1.5rem; max-width: 1000px; margin: 0 auto; }
        .message-card { padding: 2rem; display: flex; justify-content: space-between; align-items: center; gap: 2rem; transition: all 0.3s ease; }
        .message-content { flex-grow: 1; }
        
        .message-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 0.5rem;
        }

        .sender-name { font-weight: 700; color: var(--brand-accent); }
        .message-body { font-size: 1.05rem; color: var(--text-primary); margin-top: 0.5rem; font-weight: 500; }
        .status-empty { text-align: center; padding: 4rem; color: var(--text-secondary); font-size: 1.1rem; }

        @media screen and (max-width: 768px) {
            body { padding: 2rem 5%; }
            .console-header { flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; }
            .header-actions .btn { flex-grow: 1; }
            .message-card { flex-direction: column; align-items: flex-start; gap: 1.25rem; padding: 1.5rem; }
            .btn-danger { width: 100%; }
        }
    </style>
</head>
<body>

    <header class="console-header">
        <h1>Inbound Signal Console</h1>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="lockConsoleSession()">Lock Console</button>
            <a href="/" class="btn btn-secondary">← Back to Site</a>
        </div>
    </header>

    <main>
        <div id="messagesContainer" class="messages-stack">
            <!-- Data dynamically injected below -->
        </div>
    </main>

    <script>
        // Global scope helper functions declaration
        function lockConsoleSession() {
            sessionStorage.removeItem("adminAuthToken");
            window.location.reload();
        }

        function authenticateAdmin() {
            const masterToken = "GelloSecretDev2026";
            const sessionActive = sessionStorage.getItem("adminAuthToken");

            if (sessionActive === "true") {
                fetchDatabaseMessages();
                return;
            }

            setTimeout(() => {
                const identityChallenge = prompt("Security Authentication Required:\nEnter administrative master development access key password:");
                if (identityChallenge === masterToken) {
                    sessionStorage.setItem("adminAuthToken", "true");
                    fetchDatabaseMessages();
                } else {
                    alert("Access Denied.");
                    window.location.href = "/";
                }
            }, 100);
        }

        function fetchDatabaseMessages() {
            const container = document.getElementById('messagesContainer');
            if (!container) return;
            
            container.innerHTML = '<p class="status-empty">Connecting to MongoDB cloud pipeline clusters...</p>';

            fetch('/api/messages')
                .then(res => {
                    if (!res.ok) throw new Error(`Network status error: ${res.status}`);
                    return res.json();
                })
                .then(messages => {
                    container.innerHTML = '';
                    
                    if (!messages || messages.length === 0) {
                        container.innerHTML = '<div class="card-glass status-empty">💾 Database is completely clear. No active packet transmissions found.</div>';
                        return;
                    }

                    messages.reverse().forEach(msg => {
                        const card = document.createElement('div');
                        card.className = 'card-glass message-card';
                        const timestamp = msg.createdAt ? new Date(msg.createdAt).toLocaleString() : new Date().toLocaleString();

                        card.innerHTML = `
                            <div class="message-content">
                                <div class="message-meta">
                                    <span>From: <span class="sender-name">${msg.name || 'Anonymous'}</span> (${msg.email || 'N/A'})</span>
                                    <span>Received: ${timestamp}</span>
                                </div>
                                <div class="message-body">"${msg.message || ''}"</div>
                            </div>
                            <button class="btn btn-danger" onclick="eraseSignalEntry('${msg._id}', this)">
                                Erase Signal
                            </button>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    console.error("Fetch failure:", err);
                    container.innerHTML = '<div class="card-glass status-empty" style="color:#f87171;">❌ Core Pipeline Link Failure. Unable to synchronize dataset arrays.</div>';
                });
        }

        function eraseSignalEntry(messageId, buttonElement) {
            if (!confirm("Are you absolutely certain you want to permanently delete this message record out of the cloud database?")) {
                return;
            }

            fetch(`/api/messages/${messageId}`, { method: 'DELETE' })
            .then(res => {
                if (!res.ok) throw new Error(`Server rejected request.`);
                return res.json();
            })
            .then(result => {
                if (result.success) {
                    const targetedCard = buttonElement.closest('.message-card');
                    if (targetedCard) {
                        targetedCard.style.opacity = '0';
                        targetedCard.style.transform = 'translateY(15px)';
                        setTimeout(() => {
                            targetedCard.remove();
                            if (document.getElementById('messagesContainer').children.length === 0) {
                                fetchDatabaseMessages();
                            }
                        }, 300);
                    }
                } else {
                    alert(`Error: ${result.message}`);
                }
            })
            .catch(err => {
                console.error("Delete failure:", err);
                alert("Unable to transmit destruction data fields to cloud gateway node.");
            });
        }

        // Initialize runtime sequence safe triggers
        document.addEventListener("DOMContentLoaded", () => {
            authenticateAdmin();
        });
    </script>
</body>
</html>
