<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Message Console</title>
    <link rel="icon" href="data:,">
    
    <style>
        /* ==========================================================================
           ✨ DASHBOARD DESIGN CORE ARCHITECTURE
           ========================================================================== */
        :root {
            --bg-main: #0a0f1d;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --card-surface: rgba(17, 24, 39, 0.45);
            --border-glass: rgba(255, 255, 255, 0.06);
            --brand-accent: #3b82f6;
            --danger-accent: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.15);
            --shadow-blur: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            padding: 3rem 8%;
            min-height: 100vh;
        }

        .card-glass {
            background: var(--card-surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            box-shadow: var(--shadow-blur);
        }

        /* ==========================================================================
           🔒 100% NATIVE CSS LOCK OVERLAY SYSTEM (NO JAVASCRIPT NEEDED)
           ========================================================================== */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 1rem;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 3rem;
            text-align: center;
        }

        .login-card h2 { margin-bottom: 0.5rem; font-size: 1.75rem; font-weight: 800; }
        .login-card p { color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.95rem; }
        
        .login-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            padding: 1rem;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            outline: none;
        }
        .login-input:focus { border-color: var(--brand-accent); }

        /* 👑 THE NATIVE STYLING TRANSFORMATION WIZARD LINK: 
           If the password input matches the pattern exactly, drop the entire lock box overlay out of existence! */
        .login-input:placeholder-shown ~ .btn-primary { opacity: 0.5; pointer-events: none; }
        
        /* When the input becomes strictly valid, vanish the overlay layout instantly! */
        .login-input:valid {
            display: none !important;
        }
        
        body:has(.login-input:valid) .login-overlay {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.05);
        }

        body:has(.login-input:valid) #dashboardContent {
            display: block !important;
        }

        /* ==========================================================================
           🧩 MAIN DASHBOARD CONTENT (HIDDEN UNTIL CSS UNLOCKS)
           ========================================================================== */
        #dashboardContent {
            display: none;
            width: 100%;
        }

        .console-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .console-header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .counter-badge {
            font-size: 0.9rem;
            padding: 0.3rem 0.8rem;
            background: rgba(59, 130, 246, 0.15);
            color: var(--brand-accent);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 20px;
            font-weight: 700;
        }

        .header-actions { display: flex; gap: 1rem; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary { background: var(--brand-accent); color: white; width: 100%; }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); border: 1px solid var(--border-glass); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--text-secondary); }
        .btn-danger { background: var(--danger-glow); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.25); border-color: var(--danger-accent); }

        .messages-stack { display: flex; flex-direction: column; gap: 1.5rem; max-width: 1000px; margin: 0 auto; width: 100%; }
        .message-card { padding: 2rem; display: flex; justify-content: space-between; align-items: center; gap: 2rem; transition: all 0.3s ease; }
        .message-content { flex-grow: 1; }
        
        .message-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 0.5rem;
        }

        .sender-name { font-weight: 700; color: var(--brand-accent); }
        .message-body { font-size: 1.05rem; color: var(--text-primary); margin-top: 0.5rem; font-weight: 500; }
        .status-empty { text-align: center; padding: 4rem; color: var(--text-secondary); font-size: 1.1rem; }

        @media screen and (max-width: 768px) {
            .console-header { flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; }
            .header-actions .btn { flex-grow: 1; }
            .message-card { flex-direction: column; align-items: flex-start; gap: 1.25rem; padding: 1.5rem; }
            .btn-danger { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- 🔒 VISUAL ACCESS LOCK PANEL OVERLAY -->
    <div class="login-overlay">
        <div class="card-glass login-card">
            <h2>Console Lock</h2>
            <p>Security Access Credentials Required</p>
            
            <!-- ⚡ THE HTML STYLING MAGIC PILL: Uses strict regex pattern matching. 
                 The field becomes "valid" ONLY when the text matches your key exactly! -->
            <input type="text" id="passwordInput" class="login-input" placeholder="Type Master Access Key" pattern="GelloSecretDev2026" required autocomplete="off">
            
            <button class="btn btn-primary">Type Full Key to Access</button>
        </div>
    </div>

    <!-- 📊 SECURE OPERATION VIEW CONTAINER -->
    <div id="dashboardContent">
        <header class="console-header">
            <h1>
                Inbound Signal Console
                <span id="counterBadge" class="card-glass counter-badge">Active Signals: ...</span>
            </h1>
            <div class="header-actions">
                <a href="/" class="btn btn-secondary">← Back to Site</a>
            </div>
        </header>

        <main>
            <div id="messagesContainer" class="messages-stack">
                <!-- Data dynamically streamed here -->
            </div>
        </main>
    </div>

    <!-- ==========================================================================
         🧠 DATA STREAM UTILITIES (Bypasses Login Interception Completely)
         ========================================================================== -->
    <script>
        // Start streaming data right on boot load so it's loaded before you even unlock!
        window.addEventListener('DOMContentLoaded', () => {
            fetchDatabaseMessages();
        });

        function fetchDatabaseMessages() {
            const container = document.getElementById('messagesContainer');
            if (!container) return;

            container.innerHTML = '<p class="status-empty">Connecting to MongoDB cloud pipeline clusters...</p>';

            fetch('/api/messages')
                .then(res => res.json())
                .then(messages => {
                    container.innerHTML = '';
                    
                    const counterBadge = document.getElementById('counterBadge');
                    if (counterBadge) {
                        counterBadge.textContent = `Active Signals: ${messages ? messages.length : 0}`;
                    }
                    
                    if (!messages || messages.length === 0) {
                        container.innerHTML = '<div class="card-glass status-empty">💾 Database is completely clear. No active packet transmissions found.</div>';
                        return;
                    }

                    messages.reverse().forEach(msg => {
